<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ledger_Stamp - PDF Accounting Calculator</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- PDF-Lib for modifying PDFs -->
    <script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
    
    <!-- pdf.js for canvas rendering -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    </script>
    
    <!-- Tesseract.js for Screen Capture OCR -->
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

    <style>
        /* Hide arrows on number inputs for a cleaner look */
        input[type="number"]::-webkit-outer-spin-button,
        input[type="number"]::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        
        input[type="number"] {
            -moz-appearance: textfield;
        }
        
        /* Draggable Stamp Styles */
        #stamp-overlay {
            position: absolute;
            cursor: grab;
            display: none;
            z-index: 10;
            user-select: none;
            transform-origin: top left;
        }
        
        #stamp-overlay:active {
            cursor: grabbing;
        }
        
        .stamp-content {
            display: flex;
            align-items: flex-start;
            /* Align both text blocks to the top */
            gap: 100px;
            /* 100px spacing between the two columns */
        }
        
        .stamp-cash-box,
        .stamp-table-box {
            font-family: monospace;
            white-space: pre;
            line-height: 1.1;
            font-size: 14px;
            /* 14px font size */
            width: max-content;
            color: black;
            background-color: rgba(255, 255, 255, 0.9);
            /* White background for both */
            border: 1px dashed #3b82f6;
            /* Dashed border for both */
            padding: 6px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }
        
        #pdf-container {
            position: relative;
            display: inline-block;
            max-width: 100%;
        }
        
        canvas {
            max-width: 100%;
            height: auto !important;
        }
        
        /* Mobile scaling for the stamp overlay to match canvas scale */
        @media (max-width: 768px) {
            .stamp-content {
                gap: 8px;
            }
            
            .stamp-cash-box,
            .stamp-table-box {
                font-size: 0.7rem;
            }
            
            .stamp-table-box {
                padding: 2px;
            }
        }
    </style>
</head>

<body class="bg-gray-900 text-gray-100 min-h-screen p-4 sm:p-6 font-sans">
    
    <!-- Main Two-Column Layout -->
    <div class="max-w-7xl mx-auto flex flex-col lg:flex-row gap-6 lg:gap-8">
        
        <!-- ========================================== -->
        <!-- LEFT COLUMN: ACCOUNTING CALCULATOR         -->
        <!-- ========================================== -->
        <div class="w-full lg:w-1/3 flex flex-col gap-6">
            
            <!-- Main Calculation Block -->
            <div class="bg-gray-800 p-5 sm:p-6 rounded-xl shadow-lg border border-gray-700">
                <h2 class="text-lg sm:text-xl font-semibold mb-4 sm:mb-6 border-b border-gray-700 pb-2">Calculation</h2>
                
                <div class="grid grid-cols-[1fr_auto_80px] sm:grid-cols-[1fr_40px_100px] gap-y-3 items-center text-base sm:text-lg">
                    <!-- Receipt Amount -->
                    <div class="col-span-2 flex items-center" id="label-receipt">Receipt Amount</div>
                    <input type="text" inputmode="numeric" id="calc-receipt" class="bg-gray-700 border border-gray-600 rounded px-2 py-2 text-right focus:outline-none focus:border-blue-500 transition-all duration-300 w-full" placeholder="0">
                    
                    <!-- Due Collection -->
                    <div class="flex items-center" id="label-due">Due collection</div>
                    <div class="text-center text-gray-400 px-1">(+)</div>
                    <input type="text" inputmode="numeric" id="calc-due" class="bg-gray-700 border border-gray-600 rounded px-2 py-2 text-right focus:outline-none focus:border-blue-500 transition-all duration-300 w-full" placeholder="0">
                    
                    <!-- Solid Line -->
                    <div class="col-start-2 col-end-4 border-b-2 border-gray-500 my-1"></div>
                    
                    <!-- Subtotal 1 -->
                    <div class="col-start-3 text-right font-semibold pr-2" id="out-sub1">0</div>
                    
                    <!-- Expanse -->
                    <div>Expanse</div>
                    <div class="text-center text-gray-400 px-1">(-)</div>
                    <input type="text" inputmode="numeric" id="calc-expanse" class="bg-gray-700 border border-gray-600 rounded px-2 py-2 text-right focus:outline-none focus:border-blue-500 transition-colors w-full" placeholder="0">
                    
                    <!-- Solid Line -->
                    <div class="col-start-2 col-end-4 border-b-2 border-gray-500 my-1"></div>
                    
                    <!-- Subtotal 2 -->
                    <div class="col-start-3 text-right font-semibold pr-2" id="out-sub2">0</div>
                    
                    <!-- UPI (With Screen Capture Button) -->
                    <div class="flex items-center gap-2">
                        UPI
                        <button id="btn-upi-capture" class="bg-purple-600 hover:bg-purple-500 text-white rounded p-1 shadow transition-colors flex items-center justify-center w-7 h-7" title="Capture & sum from screen share">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.75 17L9 20l-1 1h8l-1-1-.75-3M3 13h18M5 17h14a2 2 0 002-2V5a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path>
                            </svg>
                        </button>
                    </div>
                    <div class="text-center text-gray-400 px-1">(-)</div>
                    <input type="text" inputmode="numeric" id="calc-upi" class="bg-gray-700 border border-gray-600 rounded px-2 py-2 text-right focus:outline-none focus:border-purple-500 transition-all duration-300 w-full" placeholder="0">
                    
                    <!-- Solid Line -->
                    <div class="col-start-2 col-end-4 border-b-2 border-gray-500 my-1"></div>
                    
                    <!-- Final Total -->
                    <div class="text-green-400 font-bold">Grand Total</div>
                    <div class="col-start-3 text-right font-bold text-green-400 pr-2" id="out-final">0</div>
                </div>
            </div>
            
            <!-- Separate Cash in Hand Block with Dynamic Rows -->
            <div class="bg-gray-800 p-5 sm:p-6 rounded-xl shadow-lg border border-gray-700">
                <div class="flex justify-between items-center mb-4 border-b border-gray-700 pb-2">
                    <h2 class="text-lg font-semibold">Cash Summary</h2>
                    <div class="flex gap-2">
                        <button id="btn-add-cash-row" class="bg-blue-600 hover:bg-blue-500 text-white rounded w-8 h-8 flex items-center justify-center font-bold text-xl transition-colors shadow-sm" title="Add amount">
                            +
                        </button>
                        <button id="btn-sub-cash-row" class="bg-red-600 hover:bg-red-500 text-white rounded w-8 h-8 flex items-center justify-center font-bold text-xl transition-colors shadow-sm" title="Subtract amount">
                            -
                        </button>
                    </div>
                </div>
                
                <div id="cash-rows-container" class="flex flex-col gap-3">
                    <!-- Base Cash in Hand -->
                    <div class="flex justify-between items-center text-base sm:text-lg">
                        <span class="text-blue-300">Cash in Hand</span>
                        <input type="text" inputmode="numeric" id="calc-cash" class="bg-gray-700 border border-gray-600 rounded px-2 py-2 text-right focus:outline-none focus:border-blue-500 transition-colors w-24 sm:w-32" placeholder="0">
                    </div>
                </div>
                
                <!-- Cash Summary Total -->
                <div class="border-b border-gray-600 my-4"></div>
                <div class="flex justify-between items-center text-lg font-bold">
                    <span class="text-green-400">Total Cash</span>
                    <span class="text-green-400 pr-2" id="out-total-cash">0</span>
                </div>
                
                <!-- Short/Extra Status -->
                <div class="flex justify-between items-center text-base font-bold mt-2" id="ui-cash-status">
                    <!-- Populated dynamically via JS -->
                </div>
            </div>
            
        </div>
        
        <!-- ========================================== -->
        <!-- RIGHT COLUMN: PDF EDITOR                   -->
        <!-- ========================================== -->
        <div class="w-full lg:w-2/3 bg-gray-800 p-4 sm:p-6 rounded-xl shadow-lg border border-gray-700 flex flex-col relative" id="right-column">
            <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 sm:gap-0 mb-2 border-b border-gray-700 pb-2">
                <h2 class="text-lg sm:text-xl font-semibold">PDF Editor & Stamper</h2>
                <button id="btn-download" disabled class="hidden w-full sm:w-auto bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-6 rounded transition-colors flex items-center justify-center gap-2 cursor-pointer text-sm shadow-md">
                    <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 17h2a2 2 0 002-2v-4a2 2 0 00-2-2H5a2 2 0 00-2 2v4a2 2 0 002 2h2m2 4h6a2 2 0 002-2v-4a2 2 0 00-2-2H9a2 2 0 00-2 2v4a2 2 0 002 2zm8-12V5a2 2 0 00-2-2H9a2 2 0 00-2 2v4h10z" />
                    </svg>
                    Print
                </button>
            </div>
            
            <!-- Upload Dropzone -->
            <div id="upload-zone" class="bg-[#1a1e29] p-3 rounded-[1.5rem] sm:rounded-[2rem] relative min-h-[300px] sm:min-h-[450px] flex items-center justify-center transition shadow-xl mt-4">
                <div class="border-2 border-dashed border-gray-600/60 rounded-[1rem] sm:rounded-[1.5rem] p-4 sm:p-8 flex flex-col items-center justify-center text-center w-full h-full min-h-[280px] sm:min-h-[420px]">
                    <div class="bg-[#242b3b] p-3 sm:p-4 rounded-2xl mb-4 sm:mb-6 shadow-sm border border-gray-700/50 pointer-events-none">
                        <svg class="w-8 h-8 sm:w-10 sm:h-10 text-[#a78bfa]" fill="currentColor" viewBox="0 0 24 24">
                            <path d="M19.35 10.04C18.67 6.59 15.64 4 12 4 9.11 4 6.6 5.64 5.35 8.04 2.34 8.36 0 10.91 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96zM14 13v4h-4v-4H7l5-5 5 5h-3z" />
                        </svg>
                    </div>
                    <h3 class="text-lg sm:text-xl font-bold text-white mb-2 pointer-events-none">Tap or Drop file here</h3>
                    <p class="text-gray-400 mb-6 sm:mb-8 text-xs sm:text-sm pointer-events-none">Import a valid PDF document or start with a blank page</p>
                    
                    <div class="flex flex-col sm:flex-row gap-3 w-full max-w-md justify-center relative z-10">
                        <label class="bg-[#242b3b] hover:bg-[#2d3548] text-white px-5 py-3 sm:px-6 sm:py-4 rounded-xl border border-gray-700/80 flex items-center justify-center gap-2 transition shadow-sm cursor-pointer flex-1">
                            <svg class="w-5 h-5 sm:w-6 sm:h-6 text-[#a78bfa]" fill="currentColor" viewBox="0 0 20 20">
                                <path d="M2 6a2 2 0 012-2h5l2 2h5a2 2 0 012 2v6a2 2 0 01-2 2H4a2 2 0 01-2-2V6z" />
                            </svg>
                            <span class="font-medium text-sm sm:text-base whitespace-nowrap">Browse Device</span>
                            <input type="file" id="pdf-upload" accept="application/pdf" class="hidden">
                        </label>
                        
                        <!-- New Blank Page Button -->
                        <button id="btn-blank-page" class="bg-blue-600 hover:bg-blue-700 text-white px-5 py-3 sm:px-6 sm:py-4 rounded-xl border border-blue-500/80 flex items-center justify-center gap-2 transition shadow-sm flex-1">
                            <svg class="w-5 h-5 sm:w-6 sm:h-6 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 13h6m-3-3v6m5 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
                            </svg>
                            <span class="font-medium text-sm sm:text-base whitespace-nowrap">Blank Page</span>
                        </button>
                    </div>
                </div>
            </div>
            
            <!-- PDF Preview & Interactive Canvas -->
            <div id="canvas-wrapper" class="hidden flex-grow bg-[#1a1e29] rounded-[1.5rem] sm:rounded-[2rem] border-2 border-dashed border-gray-600/60 flex items-start justify-center min-h-[400px] sm:min-h-[500px] overflow-auto relative p-2 sm:p-6 mt-4 pb-20">
                <button id="btn-clear-pdf" class="absolute top-2 right-2 sm:top-4 sm:right-4 bg-red-600 hover:bg-red-700 text-white rounded-full p-2 z-20 transition shadow-lg border border-red-800" title="Clear Document">
                    <svg class="w-5 h-5 sm:w-6 sm:h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M6 18L18 6M6 6l12 12" />
                    </svg>
                </button>
                
                <div id="pdf-container" class="shadow-xl border border-gray-500 rounded bg-white relative">
                    <canvas id="pdf-canvas"></canvas>
                    <div id="stamp-overlay"></div>
                </div>
                
                <!-- PDF Pagination Controls -->
                <div id="pdf-pagination" class="hidden absolute bottom-4 sm:bottom-6 left-1/2 transform -translate-x-1/2 bg-gray-900 text-white px-4 py-2 rounded-full shadow-lg border border-gray-600 flex items-center gap-4 sm:gap-6 z-20">
                    <button id="btn-prev-page" class="hover:text-blue-400 disabled:opacity-40 disabled:cursor-not-allowed transition p-1">
                        <svg class="w-5 h-5 sm:w-6 sm:h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M15 19l-7-7 7-7" />
                        </svg>
                    </button>
                    <span id="page-indicator" class="text-xs sm:text-sm font-medium tracking-wide whitespace-nowrap">Page 1 of 1</span>
                    <button id="btn-next-page" class="hover:text-blue-400 disabled:opacity-40 disabled:cursor-not-allowed transition p-1">
                        <svg class="w-5 h-5 sm:w-6 sm:h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M9 5l7 7-7 7" />
                        </svg>
                    </button>
                </div>
            </div>
        </div>
    </div>
    
    <!-- Application Logic -->
    <script>
        // --- Calculator Elements ---
        const calcCash = document.getElementById('calc-cash');
        const calcReceipt = document.getElementById('calc-receipt');
        const calcDue = document.getElementById('calc-due');
        const calcExpanse = document.getElementById('calc-expanse');
        const calcUpi = document.getElementById('calc-upi');
        const btnUpiCapture = document.getElementById('btn-upi-capture');
        const outSub1 = document.getElementById('out-sub1');
        const outSub2 = document.getElementById('out-sub2');
        const outFinal = document.getElementById('out-final');
        const outTotalCash = document.getElementById('out-total-cash');
        const uiCashStatus = document.getElementById('ui-cash-status');
        const calcInputs = [calcCash, calcReceipt, calcDue, calcExpanse, calcUpi];
        
        // --- Dynamic Cash Rows Elements ---
        const btnAddCashRow = document.getElementById('btn-add-cash-row');
        const btnSubCashRow = document.getElementById('btn-sub-cash-row');
        const cashRowsContainer = document.getElementById('cash-rows-container');
        
        // --- PDF Editor Elements ---
        const pdfUpload = document.getElementById('pdf-upload');
        const btnBlankPage = document.getElementById('btn-blank-page'); // New Element
        const btnDownload = document.getElementById('btn-download');
        const pdfContainer = document.getElementById('pdf-container');
        const pdfCanvas = document.getElementById('pdf-canvas');
        const stampOverlay = document.getElementById('stamp-overlay');
        const uploadZone = document.getElementById('upload-zone');
        const canvasWrapper = document.getElementById('canvas-wrapper');
        const btnClearPdf = document.getElementById('btn-clear-pdf');
        
        // --- Pagination Elements ---
        const pdfPagination = document.getElementById('pdf-pagination');
        const btnPrevPage = document.getElementById('btn-prev-page');
        const btnNextPage = document.getElementById('btn-next-page');
        const pageIndicator = document.getElementById('page-indicator');
        
        // --- Application State ---
        let originalPdfBytes = null;
        let loadedPdfDoc = null;
        let currentPageNum = 1;
        let totalPages = 1;
        
        // Structured State for all printable details
        let currentCalculations = {
            baseCash: 0,
            cashDetails: [],
            totalCash: 0,
            receipt: 0,
            due: 0,
            sub1: 0,
            expanse: 0,
            sub2: 0,
            upi: 0,
            final: 0
        };
        
        let pdfPageWidth = 0;
        let pdfPageHeight = 0;
        let canvasScale = 1;
        
        // --- Responsive Drag State (Stored in Native PDF Document Coordinates) ---
        let isDragging = false;
        let pdfStampX = 30; // Native document X
        let pdfStampY = 30; // Native document Y
        let dragOffsetX = 0;
        let dragOffsetY = 0;
        
        // --- Resize Listener for Responsiveness ---
        let resizeTimer;
        window.addEventListener('resize', () => {
            clearTimeout(resizeTimer);
            resizeTimer = setTimeout(() => {
                if (loadedPdfDoc) {
                    renderPage(currentPageNum);
                }
            }, 200);
        });
        
        // --- Number Formatter Helper ---
        function formatNumberInput(e) {
            if (e.target.value !== '') {
                const val = Number(e.target.value.replace(/,/g, '')) || 0;
                e.target.value = val.toLocaleString('en-IN');
            }
        }
        
        // --- Add Dynamic Addition Cash Row Logic (+) ---
        btnAddCashRow.addEventListener('click', () => {
            createDynamicCashRow('add', '(+)', 'dynamic-cash-val-add', 'text-gray-400');
        });
        
        // --- Add Dynamic Subtraction Cash Row Logic (-) ---
        btnSubCashRow.addEventListener('click', () => {
            createDynamicCashRow('sub', '(-)', 'dynamic-cash-val-sub', 'text-red-400');
        });
        
        // --- Dynamic Row Factory Function ---
        function createDynamicCashRow(type, labelText, inputClass, labelClass) {
            const row = document.createElement('div');
            row.className = `dynamic-cash-row dynamic-cash-row-${type} flex items-center gap-1 sm:gap-2 mt-2`;
            
            // Name Box
            const nameInput = document.createElement('input');
            nameInput.type = 'text';
            nameInput.className = 'dynamic-cash-name bg-gray-700 border border-gray-600 rounded px-2 py-2 focus:outline-none focus:border-blue-500 transition-colors flex-grow text-sm sm:text-base min-w-[80px]';
            nameInput.placeholder = 'Note';
            nameInput.addEventListener('input', calculateMath);
            
            // +/- Icon visual indicator
            const operatorLabel = document.createElement('div');
            operatorLabel.className = `${labelClass} font-bold px-1 text-sm sm:text-base`;
            operatorLabel.textContent = labelText;
            
            // Value Box
            const valInput = document.createElement('input');
            valInput.type = 'text';
            valInput.inputMode = 'numeric';
            valInput.className = `${inputClass} bg-gray-700 border border-gray-600 rounded px-2 py-2 text-right focus:outline-none focus:border-blue-500 transition-colors w-24 sm:w-32 text-base sm:text-lg`;
            valInput.placeholder = '0';
            
            valInput.addEventListener('input', calculateMath);
            valInput.addEventListener('blur', formatNumberInput);
            
            // Delete Button
            const delBtn = document.createElement('button');
            delBtn.innerHTML = `
                <svg class="w-5 h-5 sm:w-6 sm:h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M6 18L18 6M6 6l12 12"></path>
                </svg>
            `;
            delBtn.className = 'text-red-500 hover:text-red-400 transition p-1';
            delBtn.onclick = () => {
                row.remove();
                calculateMath();
            };
            
            row.appendChild(nameInput);
            row.appendChild(operatorLabel);
            row.appendChild(valInput);
            row.appendChild(delBtn);
            
            if (type === 'add') {
                const firstSubRow = cashRowsContainer.querySelector('.dynamic-cash-row-sub');
                if (firstSubRow) {
                    cashRowsContainer.insertBefore(row, firstSubRow);
                } else {
                    cashRowsContainer.appendChild(row);
                }
            } else {
                cashRowsContainer.appendChild(row);
            }
            
            calculateMath();
        }
        
        // --- 1. Real-time Calculation Logic ---
        function calculateMath() {
            // Base Cash sum calculation (+ and -)
            const baseCash = Number(calcCash.value.replace(/,/g, '')) || 0;
            const cashDetails = [];
            let totalCash = baseCash;
            
            document.querySelectorAll('.dynamic-cash-row').forEach(row => {
                const name = row.querySelector('.dynamic-cash-name').value || 'Note';
                const isAdd = row.classList.contains('dynamic-cash-row-add');
                const valInput = row.querySelector(isAdd ? '.dynamic-cash-val-add' : '.dynamic-cash-val-sub');
                const val = Number(valInput.value.replace(/,/g, '')) || 0;
                
                cashDetails.push({
                    name: name,
                    operator: isAdd ? '(+)' : '(-)',
                    value: val
                });
                
                if (isAdd) totalCash += val;
                else totalCash -= val;
            });
            
            // Main Receipt Calculation
            const receipt = Number(calcReceipt.value.replace(/,/g, '')) || 0;
            const due = Number(calcDue.value.replace(/,/g, '')) || 0;
            const expanse = Number(calcExpanse.value.replace(/,/g, '')) || 0;
            const upi = Number(calcUpi.value.replace(/,/g, '')) || 0;
            
            const sub1 = receipt + due;
            const sub2 = sub1 - expanse;
            const finalTotal = sub2 - upi;
            
            outTotalCash.textContent = totalCash.toLocaleString('en-IN');
            outSub1.textContent = sub1.toLocaleString('en-IN');
            outSub2.textContent = sub2.toLocaleString('en-IN');
            outFinal.textContent = finalTotal.toLocaleString('en-IN');
            
            // Short / Extra Logic
            const diff = totalCash - finalTotal;
            if (diff < 0) {
                uiCashStatus.innerHTML = `<span class="text-red-400">Cash Short :</span><span class="text-red-400 pr-2">${Math.abs(diff).toLocaleString('en-IN')}</span>`;
            } else if (diff > 0) {
                uiCashStatus.innerHTML = `<span class="text-blue-400">Cash Extra :</span><span class="text-blue-400 pr-2">${diff.toLocaleString('en-IN')}</span>`;
            } else {
                uiCashStatus.innerHTML = `<span class="text-green-400">Cash Status</span><span class="text-green-400 pr-2">✔️ OK</span>`;
            }
            
            currentCalculations = { baseCash, cashDetails, totalCash, receipt, due, sub1, expanse, sub2, upi, final: finalTotal };
            updateStampText();
        }
        
        // --- 2. String Formatters for Both Stamp Blocks ---
        function getReceiptStampLines() {
            const padNum = (num) => Number(num).toLocaleString('en-IN').padStart(10, ' ');
            const v = currentCalculations;
            return [
                `Receipt Amt ${padNum(v.receipt)}`,
                `Due Col.(+) ${padNum(v.due)}`,
                `----------------------`,
                `            ${padNum(v.sub1)}`,
                `Expanse (-) ${padNum(v.expanse)}`,
                `----------------------`,
                `            ${padNum(v.sub2)}`,
                `UPI     (-) ${padNum(v.upi)}`,
                `----------------------`,
                `Grand Total ${padNum(v.final)}`
            ];
        }
        
        function getCashStampLines() {
            const padNum = (num) => Number(num).toLocaleString('en-IN').padStart(10, ' ');
            const padName = (str) => (str || '').padEnd(10, ' ').substring(0, 10);
            
            const v = currentCalculations;
            const lines = [];
            
            lines.push(`Cash in Hand  ${padNum(v.baseCash)}`);
            
            v.cashDetails.forEach(d => {
                lines.push(`${padName(d.name)} ${d.operator}${padNum(d.value)}`);
            });
            
            if (v.cashDetails.length > 0) {
                lines.push(`------------------------`);
                lines.push(`Total Cash    ${padNum(v.totalCash)}`);
            }
            return lines;
        }
        
        function updateStampText() {
            const receiptLines = getReceiptStampLines();
            receiptLines[receiptLines.length - 1] = `<span style="font-weight: bold;">${receiptLines[receiptLines.length - 1]}</span>`;
            
            const cashLines = getCashStampLines();
            if (currentCalculations.cashDetails.length > 0) {
                cashLines[cashLines.length - 1] = `<span style="font-weight: bold;">${cashLines[cashLines.length - 1]}</span>`;
            } else {
                cashLines[0] = `<span style="font-weight: bold;">${cashLines[0]}</span>`;
            }
            
            // Format HTML status text (Allows emoji)
            const diff = currentCalculations.totalCash - currentCalculations.final;
            let statusHtml = '';
            if (diff < 0) {
                statusHtml = `Cash Short : ${Math.abs(diff).toLocaleString('en-IN')}`;
            } else if (diff > 0) {
                statusHtml = `Cash Extra : ${diff.toLocaleString('en-IN')}`;
            } else {
                statusHtml = `Cash ✔️OK`;
            }
            
            // Notice: flex-col wraps the left block and the status block to preserve the 100px gap with the right block
            stampOverlay.innerHTML = `
                <div class="stamp-content">
                    <div class="flex flex-col" style="gap: 10px;">
                        <div class="stamp-cash-box">${cashLines.join('\n')}</div>
                        <div class="font-bold text-center" style="font-family: monospace; font-size: 14px; color: black; background-color: rgba(255, 255, 255, 0.9); border: 1px dashed #3b82f6; padding: 6px; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1); width: max-content; white-space: pre;">${statusHtml}</div>
                    </div>
                    <div class="stamp-table-box">${receiptLines.join('\n')}</div>
                </div>
            `;
        }
        
        // --- 3. Drag Logic (Screen -> PDF Coordinates) ---
        function updateStampPosition() {
            stampOverlay.style.transform = `scale(${canvasScale})`;
            
            const screenX = pdfStampX * canvasScale;
            const screenY = pdfStampY * canvasScale;
            
            stampOverlay.style.left = screenX + 'px';
            stampOverlay.style.top = screenY + 'px';
        }
        
        function handleDragMove(clientX, clientY) {
            if (!isDragging) return;
            const containerRect = pdfContainer.getBoundingClientRect();
            
            let screenX = clientX - containerRect.left - dragOffsetX;
            let screenY = clientY - containerRect.top - dragOffsetY;
            
            const visualWidth = stampOverlay.offsetWidth * canvasScale;
            const visualHeight = stampOverlay.offsetHeight * canvasScale;
            screenX = Math.max(0, Math.min(screenX, containerRect.width - visualWidth));
            screenY = Math.max(0, Math.min(screenY, containerRect.height - visualHeight));
            
            pdfStampX = screenX / canvasScale;
            pdfStampY = screenY / canvasScale;
            
            updateStampPosition();
        }
        
        // Mouse Events
        stampOverlay.addEventListener('mousedown', (e) => {
            isDragging = true;
            stampOverlay.style.cursor = 'grabbing';
            const rect = stampOverlay.getBoundingClientRect();
            dragOffsetX = e.clientX - rect.left;
            dragOffsetY = e.clientY - rect.top;
            e.preventDefault();
        });
        
        window.addEventListener('mousemove', (e) => {
            if (isDragging) handleDragMove(e.clientX, e.clientY);
        });
        
        window.addEventListener('mouseup', () => {
            if (isDragging) {
                isDragging = false;
                stampOverlay.style.cursor = 'grab';
            }
        });
        
        // Touch Events
        stampOverlay.addEventListener('touchstart', (e) => {
            isDragging = true;
            const rect = stampOverlay.getBoundingClientRect();
            const touch = e.touches[0];
            dragOffsetX = touch.clientX - rect.left;
            dragOffsetY = touch.clientY - rect.top;
        }, { passive: false });
        
        window.addEventListener('touchmove', (e) => {
            if (isDragging) {
                e.preventDefault();
                const touch = e.touches[0];
                handleDragMove(touch.clientX, touch.clientY);
            }
        }, { passive: false });
        
        window.addEventListener('touchend', () => {
            if (isDragging) isDragging = false;
        });
        
        // --- 4. Render PDF Page to Canvas (Responsive) ---
        async function renderPage(pageNum) {
            if (!loadedPdfDoc) return;
            
            const page = await loadedPdfDoc.getPage(pageNum);
            const viewportForScale = page.getViewport({ scale: 1 });
            
            const containerPadding = window.innerWidth < 640 ? 16 : 48;
            const availableWidth = canvasWrapper.clientWidth - containerPadding;
            
            canvasScale = Math.min(1.5, availableWidth / viewportForScale.width);
            
            const viewport = page.getViewport({ scale: canvasScale });
            
            // Reduced the multiplier by 30% (from 3 down to 2.1)
            const outputScale = (window.devicePixelRatio || 1) * 2.1;
            
            const context = pdfCanvas.getContext('2d');
            
            pdfCanvas.width = Math.floor(viewport.width * outputScale);
            pdfCanvas.height = Math.floor(viewport.height * outputScale);
            pdfCanvas.style.width = Math.floor(viewport.width) + "px";
            pdfCanvas.style.height = Math.floor(viewport.height) + "px";
            
            const transform = outputScale !== 1 ? [outputScale, 0, 0, outputScale, 0, 0] : null;
            const renderContext = { canvasContext: context, transform: transform, viewport: viewport };
            
            await page.render(renderContext).promise;
            
            pdfPageWidth = viewportForScale.width;
            pdfPageHeight = viewportForScale.height;
            
            pageIndicator.textContent = `Page ${pageNum} of ${totalPages}`;
            btnPrevPage.disabled = pageNum <= 1;
            btnNextPage.disabled = pageNum >= totalPages;
            
            updateStampPosition();
        }
        
        btnPrevPage.addEventListener('click', () => {
            if (currentPageNum <= 1) return;
            currentPageNum--;
            renderPage(currentPageNum);
        });
        
        btnNextPage.addEventListener('click', () => {
            if (currentPageNum >= totalPages) return;
            currentPageNum++;
            renderPage(currentPageNum);
        });

        // --- AI Screen Capture & Data Extraction (UPI) ---
        btnUpiCapture.addEventListener('click', async () => {
            try {
                // UI Loading state
                const originalHtml = btnUpiCapture.innerHTML;
                btnUpiCapture.innerHTML = `<svg class="animate-spin w-4 h-4 text-white" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8H4z"></path></svg>`;
                btnUpiCapture.disabled = true;

                // 1. Request Screen Share
                const stream = await navigator.mediaDevices.getDisplayMedia({ 
                    video: { displaySurface: "browser" }, 
                    audio: false 
                });
                
                // 2. Create a hidden video element to capture the stream frame
                const video = document.createElement('video');
                video.srcObject = stream;
                await video.play();

                // Wait a moment for video to render onto the screen safely
                await new Promise(r => setTimeout(r, 600));

                // 3. Draw the current frame to a canvas
                const canvas = document.createElement('canvas');
                canvas.width = video.videoWidth;
                canvas.height = video.videoHeight;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

                // Stop all sharing tracks instantly to close the screen sharing dialog
                stream.getTracks().forEach(track => track.stop());

                // 4. Run OCR on the captured canvas image using Tesseract.js
                const worker = await Tesseract.createWorker('eng');
                const { data: { text } } = await worker.recognize(canvas);
                await worker.terminate();

                console.log("OCR Extracted Text from Screen:\n", text);

                // 5. Parse numerical values and sum them up
                // We're looking for common currency transaction formats:
                // ₹ 500.00, + 150, Rs 50, etc.
                let total = 0;
                
                // Primary Regex to locate explicitly marked currency/transactions
                const regex = /(?:₹|Rs\.?|\+)\s*([\d,]+(?:\.\d{1,2})?)/gi;
                let match;
                
                while ((match = regex.exec(text)) !== null) {
                    const valStr = match[1].replace(/,/g, '');
                    const val = parseFloat(valStr);
                    if (!isNaN(val)) {
                        total += val;
                    }
                }

                // Fallback: If nothing was found with strict symbols, search for standalone numbers with exactly 2 decimal places
                if (total === 0) {
                    const fallbackRegex = /(?:^|\s)\+?\s*([\d,]+\.\d{2})(?=\s|$)/gm; 
                    while ((match = fallbackRegex.exec(text)) !== null) {
                        const valStr = match[1].replace(/,/g, '');
                        const val = parseFloat(valStr);
                        if (!isNaN(val)) {
                            total += val;
                        }
                    }
                }

                // 6. Update the UPI UI Field
                calcUpi.value = total;
                
                // Visual feedback to indicate automated entry
                calcUpi.classList.add('ring-2', 'ring-purple-400', 'bg-purple-900/40');
                setTimeout(() => {
                    calcUpi.classList.remove('ring-2', 'ring-purple-400', 'bg-purple-900/40');
                }, 2000);
                
                calcUpi.dispatchEvent(new Event('input'));
                calcUpi.dispatchEvent(new Event('blur'));

                alert(`Extraction Complete!\nSum of transaction values found: ${total}`);

            } catch (err) {
                console.error("Screen capture/OCR error:", err);
                alert("Could not complete extraction. Make sure to grant screen share permissions.");
            } finally {
                // Restore button visual state
                btnUpiCapture.innerHTML = `<svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.75 17L9 20l-1 1h8l-1-1-.75-3M3 13h18M5 17h14a2 2 0 002-2V5a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path></svg>`;
                btnUpiCapture.disabled = false;
            }
        });

        // --- AI PDF Data Extraction (Receipt & Due) ---
        async function autoExtractPDFData(pdfBytes) {
            try {
                const pdf = await pdfjsLib.getDocument({ data: pdfBytes.slice(0) }).promise;
                
                let receiptFound = false;
                let dueFound = false;

                // Scan pages for the target table rows
                for (let i = 1; i <= pdf.numPages; i++) {
                    const page = await pdf.getPage(i);
                    const textContent = await page.getTextContent();
                    
                    // Map items with X, Y coordinates
                    let items = textContent.items.map(item => ({
                        str: item.str.trim(),
                        x: item.transform[4],
                        y: item.transform[5]
                    })).filter(i => i.str.length > 0);
                    
                    // Sort top-to-bottom (Y descending), then left-to-right (X ascending)
                    // This reconstructs the tabular layout accurately
                    items.sort((a, b) => {
                        const yDiff = b.y - a.y; 
                        if (Math.abs(yDiff) > 4) return yDiff; // 4pt tolerance for same row
                        return a.x - b.x;
                    });
                    
                    const sortedText = items.map(i => i.str).join(' ');
                    
                    // 1. Extract "GRAND TOTAL" for Receipt Amount
                    if (!receiptFound) {
                        const regexGrand = /GRAND\s+TOTAL\s+([\d,]+\.\d{2})(?:\s+([\d,]+\.\d{2}))?(?:\s+([\d,]+\.\d{2}))?(?:\s+([\d,]+\.\d{2}))?(?:\s+([\d,]+\.\d{2}))?/i;
                        const matchGrand = sortedText.match(regexGrand);
                        
                        if (matchGrand) {
                            // Find the very last captured group that has a value (the final column)
                            let extractedAmount = matchGrand[1];
                            for(let j = 5; j >= 1; j--) {
                                if (matchGrand[j]) {
                                    extractedAmount = matchGrand[j];
                                    break;
                                }
                            }
                            
                            // Set the value in the UI
                            const calcReceipt = document.getElementById('calc-receipt');
                            calcReceipt.value = extractedAmount;
                            
                            // Visual AI Feedback - Flash the input box
                            calcReceipt.classList.add('ring-2', 'ring-green-400', 'bg-green-900/40');
                            setTimeout(() => {
                                calcReceipt.classList.remove('ring-2', 'ring-green-400', 'bg-green-900/40');
                            }, 2000);
                            
                            // Add AI badge to the label
                            document.getElementById('label-receipt').innerHTML = `Receipt Amount <span class="text-[10px] sm:text-xs bg-green-500/20 text-green-400 px-2 py-0.5 rounded ml-2 border border-green-500/30 shadow-[0_0_8px_rgba(74,222,128,0.2)] whitespace-nowrap">✨ AI Extracted</span>`;
                            
                            // Trigger calculation formatting
                            calcReceipt.dispatchEvent(new Event('input'));
                            calcReceipt.dispatchEvent(new Event('blur'));
                            
                            console.log("AI Extracted Receipt Amount:", extractedAmount);
                            receiptFound = true;
                        }
                    }

                    // 2. Extract "TOTAL PREVIOUS DUE" for Due Collection
                    if (!dueFound) {
                        const regexDue = /TOTAL\s+PREVIOUS\s+DUE\s+([\d,]+\.\d{2})/i;
                        const matchDue = sortedText.match(regexDue);
                        
                        if (matchDue) {
                            // Find the very first captured amount (Paid column)
                            let extractedDueAmount = matchDue[1];
                            
                            // Set the value in the UI
                            const calcDue = document.getElementById('calc-due');
                            calcDue.value = extractedDueAmount;
                            
                            // Visual AI Feedback - Flash the input box
                            calcDue.classList.add('ring-2', 'ring-green-400', 'bg-green-900/40');
                            setTimeout(() => {
                                calcDue.classList.remove('ring-2', 'ring-green-400', 'bg-green-900/40');
                            }, 2000);
                            
                            // Add AI badge to the label
                            document.getElementById('label-due').innerHTML = `Due collection <span class="text-[10px] sm:text-xs bg-green-500/20 text-green-400 px-2 py-0.5 rounded ml-2 border border-green-500/30 shadow-[0_0_8px_rgba(74,222,128,0.2)] whitespace-nowrap">✨ AI Extracted</span>`;
                            
                            // Trigger calculation formatting
                            calcDue.dispatchEvent(new Event('input'));
                            calcDue.dispatchEvent(new Event('blur'));
                            
                            console.log("AI Extracted Due Collection:", extractedDueAmount);
                            dueFound = true;
                        }
                    }
                    
                    // Stop searching if we've successfully found both data points
                    if (receiptFound && dueFound) break; 
                }
            } catch (e) {
                console.error("AI Extraction failed:", e);
            }
        }
        
        async function loadPdfFromArrayBuffer(arrayBuffer) {
            originalPdfBytes = new Uint8Array(arrayBuffer);
            
            btnDownload.disabled = false;
            btnDownload.classList.remove('hidden');
            
            const loadingTask = pdfjsLib.getDocument({ data: originalPdfBytes.slice(0) });
            loadedPdfDoc = await loadingTask.promise;
            totalPages = loadedPdfDoc.numPages;
            currentPageNum = 1;
            
            uploadZone.classList.add('hidden');
            canvasWrapper.classList.remove('hidden');
            pdfPagination.classList.remove('hidden');
            stampOverlay.style.display = 'block';
            
            pdfStampX = 20;
            pdfStampY = 20;
            
            await renderPage(currentPageNum);
            
            // Run AI Data Extraction after render completes
            await autoExtractPDFData(originalPdfBytes);
        }
        
        // --- 5. Stamping & Download/View Logic ---
        btnDownload.addEventListener('click', async () => {
            if (!originalPdfBytes) return;
            
            const originalBtnHtml = btnDownload.innerHTML;
            btnDownload.innerHTML = "Processing...";
            btnDownload.disabled = true;
            
            try {
                const pdfDoc = await PDFLib.PDFDocument.load(originalPdfBytes);
                const courierFont = await pdfDoc.embedFont(PDFLib.StandardFonts.Courier);
                const courierBoldFont = await pdfDoc.embedFont(PDFLib.StandardFonts.CourierBold);
                const pages = pdfDoc.getPages();
                
                const targetPage = pages[currentPageNum - 1];
                
                // Layout Configurations (Native PDF sizes)
                const fontSize = 14; // Matched to CSS
                const lineHeight = 15.4; // fontSize * 1.1
                const padding = 6;
                const gap = 100; // 100px gap between the two main boxes
                const statusVerticalGap = 10; // 10px gap to the bottom status box
                
                // Overlay Top-Left Anchor
                const overlayPdfYTop = pdfPageHeight - pdfStampY;
                
                // 1. Get and measure strings
                const cashLines = getCashStampLines();
                const receiptLines = getReceiptStampLines();
                
                // Measure Widths & Heights
                const longestCashLine = [...cashLines].sort((a, b) => b.length - a.length)[0];
                const cashTextWidth = courierFont.widthOfTextAtSize(longestCashLine, fontSize);
                const cashRectHeight = (cashLines.length * lineHeight) + (padding * 2);
                const cashRectWidth = cashTextWidth + (padding * 2);
                
                const longestReceiptLine = [...receiptLines].sort((a, b) => b.length - a.length)[0];
                const receiptTextWidth = courierFont.widthOfTextAtSize(longestReceiptLine, fontSize);
                const receiptRectHeight = (receiptLines.length * lineHeight) + (padding * 2);
                const receiptRectWidth = receiptTextWidth + (padding * 2);
                
                // Coordinate Calculations
                const leftBoxX = pdfStampX;
                const leftBoxY = (pdfPageHeight - pdfStampY) - cashRectHeight;
                
                const rightBoxX = leftBoxX + cashRectWidth + gap;
                const rightBoxY = (pdfPageHeight - pdfStampY) - receiptRectHeight;
                
                // 2. Draw Left Text Block (Cash Summary) Background
                targetPage.drawRectangle({
                    x: leftBoxX,
                    y: leftBoxY,
                    width: cashRectWidth,
                    height: cashRectHeight,
                    color: PDFLib.rgb(1, 1, 1),
                    borderColor: PDFLib.rgb(0.23, 0.51, 0.96),
                    borderWidth: 1,
                    borderDashArray: [3, 3],
                    opacity: 0.9
                });
                
                // Text for Left Block
                const leftTextX = leftBoxX + padding;
                const leftTextY = (pdfPageHeight - pdfStampY) - padding - fontSize + 2;
                
                if (currentCalculations.cashDetails.length > 0) {
                    const normalCash = cashLines.slice(0, -1).join('\n');
                    const boldCash = cashLines[cashLines.length - 1];
                    
                    targetPage.drawText(normalCash, {
                        x: leftTextX,
                        y: leftTextY,
                        size: fontSize,
                        font: courierFont,
                        color: PDFLib.rgb(0, 0, 0),
                        lineHeight: lineHeight
                    });
                    targetPage.drawText(boldCash, {
                        x: leftTextX,
                        y: leftTextY - ((cashLines.length - 1) * lineHeight),
                        size: fontSize,
                        font: courierBoldFont,
                        color: PDFLib.rgb(0, 0, 0),
                        lineHeight: lineHeight
                    });
                } else {
                    targetPage.drawText(cashLines[0], {
                        x: leftTextX,
                        y: leftTextY,
                        size: fontSize,
                        font: courierBoldFont,
                        color: PDFLib.rgb(0, 0, 0)
                    });
                }
                
                // 2.5 Draw Cash Status Box (Below Cash Summary)
                const diff = currentCalculations.totalCash - currentCalculations.final;
                
                // Note: Standard fonts can't reliably render emojis like "✔️". Stripped for PDF generation.
                const statusPdfText = diff < 0 ? `Cash Short : ${Math.abs(diff).toLocaleString('en-IN')}` :
                    (diff > 0 ? `Cash Extra : ${diff.toLocaleString('en-IN')}` : `Cash OK`);
                
                const statusTextWidth = courierBoldFont.widthOfTextAtSize(statusPdfText, fontSize);
                const statusRectHeight = lineHeight + (padding * 2);
                const statusRectWidth = statusTextWidth + (padding * 2);
                
                const statusBoxX = leftBoxX;
                const statusBoxY = leftBoxY - statusVerticalGap - statusRectHeight;
                
                targetPage.drawRectangle({
                    x: statusBoxX,
                    y: statusBoxY,
                    width: statusRectWidth,
                    height: statusRectHeight,
                    color: PDFLib.rgb(1, 1, 1),
                    borderColor: PDFLib.rgb(0.23, 0.51, 0.96),
                    borderWidth: 1,
                    borderDashArray: [3, 3],
                    opacity: 0.9
                });
                
                const statusTextY = statusBoxY + statusRectHeight - padding - fontSize + 2;
                
                targetPage.drawText(statusPdfText, {
                    x: statusBoxX + padding,
                    y: statusTextY,
                    size: fontSize,
                    font: courierBoldFont,
                    color: PDFLib.rgb(0, 0, 0),
                    lineHeight: lineHeight
                });
                
                // 3. Draw Right Block (Receipt Calculation) Background
                targetPage.drawRectangle({
                    x: rightBoxX,
                    y: rightBoxY,
                    width: receiptRectWidth,
                    height: receiptRectHeight,
                    color: PDFLib.rgb(1, 1, 1),
                    borderColor: PDFLib.rgb(0.23, 0.51, 0.96),
                    borderWidth: 1,
                    borderDashArray: [3, 3],
                    opacity: 0.9
                });
                
                // Text for Right Block
                const rightTextX = rightBoxX + padding;
                const rightTextY = (pdfPageHeight - pdfStampY) - padding - fontSize + 2;
                
                const normalReceipt = receiptLines.slice(0, -1).join('\n');
                const boldReceipt = receiptLines[receiptLines.length - 1];
                
                targetPage.drawText(normalReceipt, {
                    x: rightTextX,
                    y: rightTextY,
                    size: fontSize,
                    font: courierFont,
                    color: PDFLib.rgb(0, 0, 0),
                    lineHeight: lineHeight
                });
                targetPage.drawText(boldReceipt, {
                    x: rightTextX,
                    y: rightTextY - ((receiptLines.length - 1) * lineHeight),
                    size: fontSize,
                    font: courierBoldFont,
                    color: PDFLib.rgb(0, 0, 0),
                    lineHeight: lineHeight
                });
                
                // Save & Serve the File
                const stampedPdfBytes = await pdfDoc.save();
                const blob = new Blob([stampedPdfBytes], { type: 'application/pdf' });
                const url = URL.createObjectURL(blob);
                
                const link = document.createElement('a');
                link.href = url;
                link.target = '_blank';
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                
                setTimeout(() => URL.revokeObjectURL(url), 2000);
                
            } catch (error) {
                console.error("Error creating PDF: ", error);
                alert("Error generating PDF. See console for details.");
            } finally {
                btnDownload.innerHTML = originalBtnHtml;
                btnDownload.disabled = false;
            }
        });
        
        // --- 6. Initial Event Listeners ---
        calcInputs.forEach(input => {
            input.addEventListener('input', calculateMath);
            input.addEventListener('blur', formatNumberInput);
        });
        
        pdfUpload.addEventListener('change', async (event) => {
            const file = event.target.files[0];
            if (file && file.type === 'application/pdf') {
                const arrayBuffer = await file.arrayBuffer();
                await loadPdfFromArrayBuffer(arrayBuffer);
            } else {
                alert("Please upload a valid PDF file.");
            }
            event.target.value = '';
        });
        
        // Event Listener for the New "Blank Page" Button
        btnBlankPage.addEventListener('click', async () => {
            try {
                // Create a completely new PDF
                const newPdf = await PDFLib.PDFDocument.create();
                
                // Add a blank A4 Page (595.28 x 841.89 points)
                newPdf.addPage([595.28, 841.89]);
                
                // Save document to byte array
                const pdfBytes = await newPdf.save();
                
                // Load it into the existing viewer logic
                await loadPdfFromArrayBuffer(pdfBytes.buffer);
            } catch (error) {
                console.error("Error creating blank PDF:", error);
                alert("Could not generate a blank page.");
            }
        });
        
        uploadZone.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadZone.style.opacity = '0.7';
        });
        
        uploadZone.addEventListener('dragleave', (e) => {
            e.preventDefault();
            uploadZone.style.opacity = '1';
        });
        
        uploadZone.addEventListener('drop', async (e) => {
            e.preventDefault();
            uploadZone.style.opacity = '1';
            const file = e.dataTransfer.files[0];
            if (file && file.type === 'application/pdf') {
                const arrayBuffer = await file.arrayBuffer();
                await loadPdfFromArrayBuffer(arrayBuffer);
            } else {
                alert("Please drop a valid PDF file.");
            }
        });
        
        // --- 7. Clear PDF Logic ---
        btnClearPdf.addEventListener('click', () => {
            originalPdfBytes = null;
            loadedPdfDoc = null;
            currentPageNum = 1;
            totalPages = 1;
            
            btnDownload.disabled = true;
            btnDownload.classList.add('hidden');
            canvasWrapper.classList.add('hidden');
            uploadZone.classList.remove('hidden');
            pdfPagination.classList.add('hidden');
            stampOverlay.style.display = 'none';
            
            const context = pdfCanvas.getContext('2d');
            context.clearRect(0, 0, pdfCanvas.width, pdfCanvas.height);
        });
        
        // Initialize state
        calculateMath();
